<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラウド同期 Web メモ帳</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Identity Services (async/deferを外し確実に読み込み) -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- ヘッダー -->
  <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-cloud text-brand-500 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-tight">Cloud Web Notes</h1>
      </div>
      
      <!-- ステータス & アクション -->
      <div class="flex items-center space-x-3">
        <!-- 同期ステータス表示 -->
        <span id="syncStatus" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-circle-dot text-slate-400"></i> 未接続
        </span>

        <!-- Google ログイン / ログアウトボタン -->
        <button id="authBtn" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition flex items-center gap-1.5">
          <i class="fa-brands fa-google"></i> <span>Drive接続</span>
        </button>

        <div class="h-5 w-px bg-slate-300 dark:bg-slate-600"></div>

        <!-- テーマ切替 -->
        <button id="themeToggleBtn" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Google Client ID 設定エリア -->
  <div id="clientIdBanner" class="bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-800 p-4">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-amber-800 dark:text-amber-200">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-amber-600 text-base"></i>
        <span>Google Driveと同期するには、ご自身の <strong>Google OAuth クライアントID</strong> の入力が必要です。</span>
      </div>
      <div class="flex w-full sm:w-auto gap-2">
        <input type="text" id="clientIdInput" placeholder="xxxxxx.apps.googleusercontent.com" 
          class="px-3 py-1.5 bg-white dark:bg-slate-900 border border-amber-300 dark:border-amber-700 rounded text-slate-800 dark:text-white flex-1 sm:w-80">
        <button id="saveClientIdBtn" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded font-medium whitespace-nowrap">保存</button>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- 入力フォーム -->
      <section class="lg:col-span-5 bg-white dark:bg-slate-800 rounded-xl shadow-md p-5 border border-slate-200 dark:border-slate-700">
        <div class="flex items-center justify-between mb-4">
          <h2 id="formTitle" class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-brand-500"></i> 新規メモ作成
          </h2>
          <button id="resetFormBtn" class="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 underline hidden">
            キャンセル
          </button>
        </div>
        
        <form id="noteForm" class="space-y-4">
          <input type="hidden" id="noteId">
          
          <div>
            <label for="titleInput" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">タイトル</label>
            <input type="text" id="titleInput" required placeholder="メモのタイトルを入力..."
              class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white transition">
          </div>
          
          <div>
            <label for="contentInput" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">本文</label>
            <textarea id="contentInput" rows="8" required placeholder="メモの本文を入力..."
              class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white transition resize-y"></textarea>
          </div>

          <button type="submit" id="saveBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> クラウドに保存
          </button>
        </form>
      </section>

      <!-- 一覧 & 検索 -->
      <section class="lg:col-span-7 space-y-4">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md p-4 border border-slate-200 dark:border-slate-700 space-y-3">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="キーワード検索..."
              class="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white transition">
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
            <div class="flex items-center gap-2">
              <label for="dateFilter" class="text-xs text-slate-500">日付:</label>
              <input type="date" id="dateFilter" class="w-full px-2 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs dark:text-white">
              <button id="clearDateBtn" class="text-xs text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex items-center gap-2">
              <label for="sortSelect" class="text-xs text-slate-500">並び替え:</label>
              <select id="sortSelect" class="w-full px-2 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs dark:text-white">
                <option value="createdAt_desc">登録日時 (新しい順)</option>
                <option value="createdAt_asc">登録日時 (古い順)</option>
                <option value="updatedAt_desc">更新日時 (新しい順)</option>
                <option value="updatedAt_asc">更新日時 (古い順)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="flex justify-between items-center text-xs text-slate-500 px-1">
          <span id="noteCount">全 0 件</span>
          <button id="manualSyncBtn" class="hover:text-brand-500 flex items-center gap-1" title="最新データに更新">
            <i class="fa-solid fa-rotate"></i> 手動同期
          </button>
        </div>

        <div id="noteList" class="space-y-3"></div>
      </section>

    </div>
  </main>

  <!-- 削除モーダル -->
  <div id="deleteModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl max-w-sm w-full p-6 mx-4 space-y-4 border border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-3 text-red-500">
        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
        <h3 class="font-bold text-lg text-slate-900 dark:text-white">メモの削除</h3>
      </div>
      <p class="text-sm text-slate-600 dark:text-slate-300">Google Drive上のクラウドデータからも削除されます。よろしいですか？</p>
      <div class="flex justify-end gap-2 pt-2">
        <button id="cancelDeleteBtn" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 rounded-lg">キャンセル</button>
        <button id="confirmDeleteBtn" class="px-4 py-2 text-sm font-medium bg-red-600 hover:bg-red-700 text-white rounded-lg">削除する</button>
      </div>
    </div>
  </div>

  <script>
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
    const FILE_NAME = 'WebNotesDB.json';

    const formatDate = (date = new Date()) => {
      const pad = n => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    };

    class CloudNoteApp {
      constructor() {
        this.notes = [];
        this.tokenClient = null;
        this.accessToken = null;
        this.fileId = null;
        this.currentDeleteId = null;
        
        this.initDOM();
        this.initTheme();
        this.loadClientId();
        this.bindEvents();
      }

      initDOM() {
        this.dom = {
          clientIdBanner: document.getElementById('clientIdBanner'),
          clientIdInput: document.getElementById('clientIdInput'),
          saveClientIdBtn: document.getElementById('saveClientIdBtn'),
          authBtn: document.getElementById('authBtn'),
          syncStatus: document.getElementById('syncStatus'),
          noteForm: document.getElementById('noteForm'),
          noteId: document.getElementById('noteId'),
          titleInput: document.getElementById('titleInput'),
          contentInput: document.getElementById('contentInput'),
          formTitle: document.getElementById('formTitle'),
          resetFormBtn: document.getElementById('resetFormBtn'),
          searchInput: document.getElementById('searchInput'),
          dateFilter: document.getElementById('dateFilter'),
          clearDateBtn: document.getElementById('clearDateBtn'),
          sortSelect: document.getElementById('sortSelect'),
          noteList: document.getElementById('noteList'),
          noteCount: document.getElementById('noteCount'),
          manualSyncBtn: document.getElementById('manualSyncBtn'),
          themeToggleBtn: document.getElementById('themeToggleBtn'),
          deleteModal: document.getElementById('deleteModal'),
          confirmDeleteBtn: document.getElementById('confirmDeleteBtn'),
          cancelDeleteBtn: document.getElementById('cancelDeleteBtn')
        };
      }

      initTheme() {
        if (localStorage.getItem('web_notes_theme') === 'dark' || (!localStorage.getItem('web_notes_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      }

      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('web_notes_theme', isDark ? 'dark' : 'light');
      }

      loadClientId() {
        const clientId = localStorage.getItem('google_client_id');
        if (clientId) {
          this.dom.clientIdInput.value = clientId;
          this.dom.clientIdBanner.classList.add('hidden');
          this.initGoogleAuth(clientId);
        }
      }

      initGoogleAuth(clientId) {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          setTimeout(() => this.initGoogleAuth(clientId), 200);
          return;
        }
        this.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: SCOPES,
          callback: async (resp) => {
            if (resp.error) {
              console.error('Auth Error:', resp);
              this.updateStatus('offline', '認証エラー');
              return;
            }
            this.accessToken = resp.access_token;
            this.updateStatus('syncing', '同期中...');
            this.dom.authBtn.querySelector('span').textContent = '切断';
            await this.syncWithDrive();
          },
        });
      }

      bindEvents() {
        this.dom.themeToggleBtn.addEventListener('click', () => this.toggleTheme());
        
        this.dom.saveClientIdBtn.addEventListener('click', () => {
          const val = this.dom.clientIdInput.value.trim();
          if (val) {
            localStorage.setItem('google_client_id', val);
            this.dom.clientIdBanner.classList.add('hidden');
            this.initGoogleAuth(val);
            alert('クライアントIDを保存しました。「Drive接続」を押してログインしてください。');
          }
        });

        this.dom.authBtn.addEventListener('click', () => {
          const clientId = localStorage.getItem('google_client_id');
          if (!clientId) {
            alert('先にGoogleクライアントIDを設定してください。');
            return;
          }

          if (this.accessToken) {
            this.accessToken = null;
            this.updateStatus('offline', '未接続');
            this.dom.authBtn.querySelector('span').textContent = 'Drive接続';
            this.notes = [];
            this.render();
          } else {
            if (!this.tokenClient) {
              this.initGoogleAuth(clientId);
            }
            // スマホのポップアップブロックを回避するためタップ直後に実行
            if (this.tokenClient) {
              this.tokenClient.requestAccessToken({ prompt: '' });
            } else {
              alert('Google認証ライブラリを読み込み中です。少し待って再試行してください。');
            }
          }
        });

        this.dom.manualSyncBtn.addEventListener('click', () => {
          if (this.accessToken) this.syncWithDrive();
        });

        this.dom.noteForm.addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleSubmit();
        });

        this.dom.resetFormBtn.addEventListener('click', () => this.resetForm());
        this.dom.searchInput.addEventListener('input', () => this.render());
        this.dom.dateFilter.addEventListener('change', () => this.render());
        this.dom.clearDateBtn.addEventListener('click', () => { this.dom.dateFilter.value = ''; this.render(); });
        this.dom.sortSelect.addEventListener('change', () => this.render());

        this.dom.cancelDeleteBtn.addEventListener('click', () => this.closeDeleteModal());
        this.dom.confirmDeleteBtn.addEventListener('click', () => {
          if (this.currentDeleteId) {
            this.deleteNote(this.currentDeleteId);
            this.closeDeleteModal();
          }
        });
      }

      updateStatus(state, text) {
        const el = this.dom.syncStatus;
        if (state === 'online') {
          el.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 flex items-center gap-1.5';
          el.innerHTML = `<i class="fa-solid fa-cloud-check"></i> ${text}`;
        } else if (state === 'syncing') {
          el.className = 'text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400 flex items-center gap-1.5';
          el.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${text}`;
        } else {
          el.className = 'text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300 flex items-center gap-1.5';
          el.innerHTML = `<i class="fa-solid fa-circle-dot text-slate-400"></i> ${text}`;
        }
      }

      async syncWithDrive() {
        try {
          if (!this.accessToken) return;

          if (!this.fileId) {
            const q = encodeURIComponent(`name = '${FILE_NAME}' and trashed = false`);
            const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}`, {
              method: 'GET',
              headers: {
                'Authorization': `Bearer ${this.accessToken}`,
                'Content-Type': 'application/json'
              }
            });
            const data = await res.json();

            if (data.files && data.files.length > 0) {
              this.fileId = data.files[0].id;
            }
          }

          if (this.fileId) {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`, {
              headers: { Authorization: `Bearer ${this.accessToken}` }
            });
            this.notes = await res.json();
          } else {
            await this.saveToDrive();
          }
          this.updateStatus('online', 'クラウド同期中');
          this.render();
        } catch (e) {
          console.error('Drive API Error', e);
          this.updateStatus('offline', '同期エラー');
        }
      }

      async saveToDrive() {
        this.updateStatus('syncing', '保存中...');
        const metadata = { name: FILE_NAME, mimeType: 'application/json' };
        const content = JSON.stringify(this.notes, null, 2);

        try {
          if (this.fileId) {
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=media`, {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${this.accessToken}`, 'Content-Type': 'application/json' },
              body: content
            });
          } else {
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([content], { type: 'application/json' }));

            const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
              method: 'POST',
              headers: { Authorization: `Bearer ${this.accessToken}` },
              body: form
            });
            const data = await res.json();
            this.fileId = data.id;
          }
          this.updateStatus('online', 'クラウド同期中');
        } catch (e) {
          console.error('Drive Save Error', e);
          this.updateStatus('offline', '保存失敗');
        }
      }

      async handleSubmit() {
        if (!this.accessToken) {
          alert('先にGoogle Driveに接続してください。');
          return;
        }

        const id = this.dom.noteId.value;
        const title = this.dom.titleInput.value.trim();
        const content = this.dom.contentInput.value.trim();
        if (!title || !content) return;

        const now = formatDate();

        if (id) {
          const index = this.notes.findIndex(n => n.id === id);
          if (index !== -1) {
            this.notes[index] = { ...this.notes[index], title, content, updatedAt: now };
          }
        } else {
          this.notes.unshift({
            id: Date.now().toString(36) + Math.random().toString(36).substring(2),
            title, content, createdAt: now, updatedAt: null
          });
        }

        this.resetForm();
        this.render();
        await this.saveToDrive();
      }

      editNote(id) {
        const note = this.notes.find(n => n.id === id);
        if (!note) return;
        this.dom.noteId.value = note.id;
        this.dom.titleInput.value = note.title;
        this.dom.contentInput.value = note.content;
        this.dom.formTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-brand-500"></i> メモの編集`;
        this.dom.resetFormBtn.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      resetForm() {
        this.dom.noteId.value = '';
        this.dom.noteForm.reset();
        this.dom.formTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-brand-500"></i> 新規メモ作成`;
        this.dom.resetFormBtn.classList.add('hidden');
      }

      openDeleteModal(id) {
        this.currentDeleteId = id;
        this.dom.deleteModal.classList.remove('hidden');
        setTimeout(() => this.dom.deleteModal.classList.remove('opacity-0'), 10);
      }

      closeDeleteModal() {
        this.dom.deleteModal.classList.add('opacity-0');
        setTimeout(() => {
          this.dom.deleteModal.classList.add('hidden');
          this.currentDeleteId = null;
        }, 200);
      }

      async deleteNote(id) {
        this.notes = this.notes.filter(n => n.id !== id);
        if (this.dom.noteId.value === id) this.resetForm();
        this.render();
        await this.saveToDrive();
      }

      normalizeStr(str) {
        return (str.normalize ? str.normalize('NFKC') : str).toLowerCase();
      }

      getFilteredNotes() {
        const query = this.normalizeStr(this.dom.searchInput.value.trim());
        const selectedDate = this.dom.dateFilter.value;
        const sortOption = this.dom.sortSelect.value;

        return this.notes.filter(note => {
          const matchTitle = this.normalizeStr(note.title).includes(query);
          const matchContent = this.normalizeStr(note.content).includes(query);
          const matchesQuery = !query || matchTitle || matchContent;

          let matchesDate = true;
          if (selectedDate) {
            const createdDateStr = note.createdAt ? note.createdAt.split(' ')[0] : '';
            const updatedDateStr = note.updatedAt ? note.updatedAt.split(' ')[0] : '';
            matchesDate = (createdDateStr === selectedDate) || (updatedDateStr === selectedDate);
          }
          return matchesQuery && matchesDate;
        }).sort((a, b) => {
          const [key, order] = sortOption.split('_');
          let valA = a[key] || a.createdAt;
          let valB = b[key] || b.createdAt;
          return order === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });
      }

      render() {
        const filtered = this.getFilteredNotes();
        this.dom.noteCount.textContent = `表示中: ${filtered.length} 件 / 全 ${this.notes.length} 件`;
        this.dom.noteList.innerHTML = '';

        if (!this.accessToken) {
          this.dom.noteList.innerHTML = `
            <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
              <i class="fa-solid fa-plug-circle-exclamation text-4xl text-slate-300 dark:text-slate-600 mb-2"></i>
              <p class="text-slate-500 dark:text-slate-400 text-sm">右上ボタンからGoogle Driveへ接続してください</p>
            </div>`;
          return;
        }

        if (filtered.length === 0) {
          this.dom.noteList.innerHTML = `
            <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
              <i class="fa-regular fa-folder-open text-4xl text-slate-300 dark:text-slate-600 mb-2"></i>
              <p class="text-slate-500 dark:text-slate-400 text-sm">メモが見つかりません</p>
            </div>`;
          return;
        }

        filtered.forEach(note => {
          const card = document.createElement('article');
          card.className = 'bg-white dark:bg-slate-800 rounded-xl shadow-sm hover:shadow-md transition border border-slate-200 dark:border-slate-700 p-4 space-y-3';

          const header = document.createElement('div');
          header.className = 'flex items-start justify-between gap-2';

          const title = document.createElement('h3');
          title.className = 'font-bold text-base text-slate-900 dark:text-slate-100 break-all';
          title.textContent = note.title;

          const actions = document.createElement('div');
          actions.className = 'flex items-center gap-1 shrink-0';

          const editBtn = document.createElement('button');
          editBtn.className = 'p-1.5 text-slate-400 hover:text-brand-500 rounded transition';
          editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
          editBtn.addEventListener('click', () => this.editNote(note.id));

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'p-1.5 text-slate-400 hover:text-red-500 rounded transition';
          deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
          deleteBtn.addEventListener('click', () => this.openDeleteModal(note.id));

          actions.appendChild(editBtn);
          actions.appendChild(deleteBtn);
          header.appendChild(title);
          header.appendChild(actions);

          const content = document.createElement('p');
          content.className = 'text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap break-all line-clamp-6';
          content.textContent = note.content;

          const footer = document.createElement('div');
          footer.className = 'flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400 dark:text-slate-500 pt-2 border-t border-slate-100 dark:border-slate-700/50';
          let metaText = `<span title="登録日時"><i class="fa-regular fa-clock mr-1"></i>${note.createdAt}</span>`;
          if (note.updatedAt) metaText += `<span title="最終更新日時"><i class="fa-solid fa-rotate mr-1"></i>${note.updatedAt}</span>`;
          footer.innerHTML = metaText;

          card.appendChild(header);
          card.appendChild(content);
          card.appendChild(footer);
          this.dom.noteList.appendChild(card);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => { new CloudNoteApp(); });
  </script>
</body>
</html>
